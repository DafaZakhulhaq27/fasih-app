name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The RLS tests need Postgres and Auth; the Edge Function tests also need the API gateway,
      # PostgREST, Storage and the Edge Runtime.
      - name: Start local Supabase
        run: >-
          npx supabase start
          -x realtime,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor

      - name: Reset the database twice
        run: npx supabase db reset && npx supabase db reset

      - name: RLS tests
        run: npx supabase test db

      - name: Generated database types are up to date
        run: npm run db:types && git diff --exit-code src/lib/database.types.ts

      - name: Edge Function tests
        run: npm run test:functions
